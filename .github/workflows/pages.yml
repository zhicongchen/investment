name: Deploy dashboard to GitHub Pages

on:
  schedule:
    # Weekdays 21:37 UTC = 16:37 EST / 17:37 EDT, after the US close all year.
    # GitHub may start scheduled runs late; the data is still that day's close.
    - cron: "37 21 * * 1-5"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pages/**"
      - "options/**"
      - "shared/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "pages/**"
      - "options/**"
      - "shared/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pages/requirements.txt
      - run: pip install -r pages/requirements.txt
      # Daily bars, fundamentals and the put scan for pages/watchlist.yaml, from Yahoo Finance.
      - run: python -m pages.build --out frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend
        env:
          # Read the published data files; the hosted page never calls a local backend.
          VITE_DATA_MODE: browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
